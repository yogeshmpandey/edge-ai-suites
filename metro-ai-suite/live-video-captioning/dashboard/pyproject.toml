[project]
name = "webrtc-dashboard"
version = "0.1.0"
description = "WebRTC dashboard with aiohttp async server"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9.0",
    "aiohttp-cors>=0.7.0",
    "aiohttp-swagger3>=0.8.0",
    "psutil>=7.1.3",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["dashboard*"]

[tool.setuptools.package-data]
dashboard = ["public/*"]
