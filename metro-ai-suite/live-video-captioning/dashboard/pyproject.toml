[project]
name = "webrtc-dashboard"
version = "0.1.0"
description = "WebRTC dashboard with FastAPI server"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn==0.32.1",
    "psutil==7.1.3",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app"]
