[project]
name = "live-video-captioning"
version = "0.1.0"
description = "Live Video Captioning with FastAPI backend and WebRTC frontend"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn==0.32.1",
    "websockets>=12.0",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]
