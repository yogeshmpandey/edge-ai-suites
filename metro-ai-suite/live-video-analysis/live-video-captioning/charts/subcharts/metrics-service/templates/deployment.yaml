{{/*
Copyright (C) 2026 Intel Corporation
SPDX-License-Identifier: Apache-2.0

metrics-service Deployment.

Bundles the Telegraf collector and the WebSocket relay in a single privileged
pod. It binds host ports for the relay (9090) and Prometheus (9273), so only a
single replica can run per node.

Kubernetes equivalents of the compose configuration:
  pid: host                    → hostPID: true
  privileged: true             → securityContext.privileged: true
  devices /dev/dri             → hostPath volume
  /sys, /run (read-only)       → hostPath volumes

The image ships a complete default telegraf config (CPU, memory, temperature,
GPU via qmassa and NPU via npu_reader), so no telegraf.conf ConfigMap is needed.
*/}}
{{- if gt (int .Values.replicaCount) 1 }}
{{- fail "metrics-service replicaCount must be 1: multiple replicas conflict on the host TCP port." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "metrics-service.fullname" . }}
  labels:
    {{- include "metrics-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics-service
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "metrics-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "metrics-service.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: metrics-service
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "lvc.imagePullSecrets" . | nindent 6 }}
      {{- include "lvc.nodeAffinity" . | nindent 6 }}
      # hostPID required for qmassa GPU/NPU monitoring (matches compose pid: host).
      hostPID: {{ .Values.hostPID }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: metrics-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: metrics
              containerPort: {{ .Values.service.port }}
              hostPort: {{ .Values.service.nodePort }}
              protocol: TCP
            - name: prometheus
              containerPort: {{ .Values.service.prometheusPort }}
              hostPort: {{ .Values.service.prometheusPort }}
              protocol: TCP
          env:
            - name: METRICS_PORT
              value: {{ .Values.env.metricsPort | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.env.logLevel | quote }}
            - name: CORS_ORIGINS
              value: {{ .Values.env.corsOrigins | quote }}
            - name: PROMETHEUS_POLLER_INTERVAL_MS
              value: {{ .Values.env.pollIntervalMs | quote }}
            {{- include "lvc.proxyEnv" . | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: host-dev-dri
              mountPath: /dev/dri
            - name: host-sys
              mountPath: /sys
              readOnly: true
            - name: host-run
              mountPath: /run
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: host-dev-dri
          hostPath:
            path: /dev/dri
        - name: host-sys
          hostPath:
            path: /sys
        - name: host-run
          hostPath:
            path: /run
