# metrics-service/values.yaml

fullnameOverride: ""

replicaCount: 1

image:
  repository: docker.io/intel/metrics-service
  tag: "2026.1.0-20260417-weekly"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 9090
  nodePort: 9090

env:
  metricsPort: "9090"
  logLevel: "INFO"
  corsOrigins: "*"
  metricsRetentionSeconds: "300"

# Privileged access required for hardware metrics (GPU via qmassa, CPU freq).
hostPID: true

podSecurityContext:
  runAsUser: 0

securityContext:
  privileged: true
  allowPrivilegeEscalation: true

resources:
  requests:
    cpu: "200m"
    memory: "256Mi"
  limits:
    cpu: "1"
    memory: "512Mi"

podAnnotations: {}
podLabels: {}
