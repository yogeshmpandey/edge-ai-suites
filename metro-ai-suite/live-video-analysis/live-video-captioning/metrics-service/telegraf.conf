# =============================================================================
# Telegraf Configuration for Metric Service
# =============================================================================
#
# Custom config that enables the WebSocket output so Telegraf sends
# collected system metrics to the metrics-service relay at /ws/collector,
# which then broadcasts them to all connected UI clients at /ws/clients.
#
# =============================================================================

# -----------------------------------------------------------------------------
# Global Agent Configuration
# -----------------------------------------------------------------------------
[agent]
  interval = "1s"
  round_interval = true
  metric_batch_size = 2000
  metric_buffer_limit = 20000
  collection_jitter = "0s"
  flush_interval = "1s"
  flush_jitter = "0s"
  precision = "1s"
  debug = false
  quiet = true

# -----------------------------------------------------------------------------
# Input Plugins - System Metrics
# -----------------------------------------------------------------------------

[[inputs.cpu]]
  percpu = false
  totalcpu = true
  collect_cpu_time = false
  report_active = false
  core_tags = false
  fieldinclude = ["usage_user", "usage_system", "usage_idle"]

[[inputs.mem]]
  fieldinclude = ["used_percent", "available_percent", "total", "used"]

[[inputs.exec]]
  commands = ["/app/scripts/read_cpu_freq.sh"]
  data_format = "influx"
  interval = "1s"

[[inputs.execd]]
  command = ["python3", "/app/scripts/qmassa_reader.py"]
  data_format = "influx"

[[inputs.temp]]

[[processors.starlark]]
  namepass = ["temp"]
  source = '''
def apply(metric):
    return metric if metric.tags.get("sensor", "").startswith("coretemp_package_id_") else None
'''

# -----------------------------------------------------------------------------
# Output Plugins
# -----------------------------------------------------------------------------

# Prometheus endpoint for scraping (port 9273)
[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 1
  path = "/metrics"
  collectors_exclude = ["gocollector", "process"]
  string_as_label = true
  export_timestamp = true

# WebSocket output - sends metrics to the relay for real-time UI streaming
[[outputs.websocket]]
  url = "ws://localhost:9090/ws/collector"
  data_format = "json"
  read_timeout = "0s"

# -----------------------------------------------------------------------------
# HTTP Listener for custom metrics push (alternative to REST API)
# -----------------------------------------------------------------------------

[[inputs.http_listener_v2]]
  service_address = ":8186"
  paths = ["/write", "/api/v2/write"]
  methods = ["POST"]
  data_format = "influx"
  read_timeout = "10s"
  write_timeout = "10s"
