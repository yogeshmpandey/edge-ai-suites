mqtt:
  enabled: true
  host: mqtt-broker
  port: 1883
  topic_prefix: frigate
  client_id: frigate
  user: '{FRIGATE_MQTT_USER}'
  password: '{FRIGATE_MQTT_PASSWORD}'

logger:
  default: info

detect:
  enabled: false

snapshots:
  enabled: false

record:
  enabled: true
  retain:
    days: 1
    mode: all

go2rtc:
  rtsp:
    listen: ":8554"
  streams:
    camera1:
      - "exec:/usr/lib/ffmpeg/7.0/bin/ffmpeg -hide_banner -re -stream_loop -1 -i /videos/1122north_h264.ts -c:v libx264 -preset ultrafast -tune zerolatency -profile:v baseline -level:v 3.1 -g 30 -keyint_min 30 -sc_threshold 0 -bf 0 -pix_fmt yuv420p -avoid_negative_ts make_zero -rtsp_transport tcp -f rtsp {{output}}"
    camera2:
      - "exec:/usr/lib/ffmpeg/7.0/bin/ffmpeg -hide_banner -re -stream_loop -1 -i /videos/1122east_h264.ts -c:v libx264 -preset ultrafast -tune zerolatency -profile:v baseline -level:v 3.1 -g 30 -keyint_min 30 -sc_threshold 0 -bf 0 -pix_fmt yuv420p -avoid_negative_ts make_zero -rtsp_transport tcp -f rtsp {{output}}"
    camera3:
      - "exec:/usr/lib/ffmpeg/7.0/bin/ffmpeg -hide_banner -re -stream_loop -1 -i /videos/1122south_h264.ts -c:v libx264 -preset ultrafast -tune zerolatency -profile:v baseline -level:v 3.1 -g 30 -keyint_min 30 -sc_threshold 0 -bf 0 -pix_fmt yuv420p -avoid_negative_ts make_zero -rtsp_transport tcp -f rtsp {{output}}"
    camera4:
      - "exec:/usr/lib/ffmpeg/7.0/bin/ffmpeg -hide_banner -re -stream_loop -1 -i /videos/1122west_h264.ts -c:v libx264 -preset ultrafast -tune zerolatency -profile:v baseline -level:v 3.1 -g 30 -keyint_min 30 -sc_threshold 0 -bf 0 -pix_fmt yuv420p -avoid_negative_ts make_zero -rtsp_transport tcp -f rtsp {{output}}"

cameras:
  camera1:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/camera1
          input_args: preset-rtsp-restream
          roles:
            - record
      output_args:
        record: -f segment -segment_time 10 -segment_format mp4 -reset_timestamps 1 -strftime 1 -c:v copy -movflags +faststart
    detect:
      enabled: false
    motion:
      enabled: false
    snapshots:
      enabled: false
    record:
      enabled: true
      retain:
        days: 1
        mode: all

  camera2:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/camera2
          input_args: preset-rtsp-restream
          roles:
            - record
      output_args:
        record: -f segment -segment_time 10 -segment_format mp4 -reset_timestamps 1 -strftime 1 -c:v copy -movflags +faststart
    detect:
      enabled: false
    motion:
      enabled: false
    snapshots:
      enabled: false
    record:
      enabled: true
      retain:
        days: 1
        mode: all

  camera3:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/camera3
          input_args: preset-rtsp-restream
          roles:
            - record
      output_args:
        record: -f segment -segment_time 10 -segment_format mp4 -reset_timestamps 1 -strftime 1 -c:v copy -movflags +faststart
    detect:
      enabled: false
    motion:
      enabled: false
    snapshots:
      enabled: false
    record:
      enabled: true
      retain:
        days: 1
        mode: all

  camera4:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/camera4
          input_args: preset-rtsp-restream
          roles:
            - record
      output_args:
        record: -f segment -segment_time 10 -segment_format mp4 -reset_timestamps 1 -strftime 1 -c:v copy -movflags +faststart
    detect:
      enabled: false
    motion:
      enabled: false
    snapshots:
      enabled: false
    record:
      enabled: true
      retain:
        days: 1
        mode: all

version: 0.15-1
