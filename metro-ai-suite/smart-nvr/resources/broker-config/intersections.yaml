# Smart NVR intersections - single source of configuration.
# Each entry holds the intersection name, its IP (MQTT broker + RTSP source)
# and its 4 cameras (<id>-camera1 .. <id>-camera4).
# Managed by setup.sh and the /brokers/ API; safe to edit while stopped.
intersections:
- id: si1
  name: Main Street and 1st Ave
  ip: <SI Host IP>
  enabled: true
  cameras:
  - name: si1-camera1
    url: rtsp://<camera_ip>:8554/camera1
  - name: si1-camera2
    url: rtsp://<camera_ip>:8554/camera2
  - name: si1-camera3
    url: rtsp://<camera_ip>:8554/camera3
  - name: si1-camera4
    url: rtsp://<camera_ip>:8554/camera4